<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffd6e6 0%, #ffb3c1 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .heart {
            position: absolute;
            width: 15px;
            height: 15px;
            background: linear-gradient(135deg, #ff6b8a 0%, #ff8fab 100%);
            transform: rotate(-45deg);
            opacity: 0;
            animation: floatUp 4s ease-in-out infinite;
        }

        .heart::before,
        .heart::after {
            content: '';
            position: absolute;
            width: 15px;
            height: 15px;
            background: inherit;
            border-radius: 50%;
        }

        .heart::before {
            top: -7.5px;
            left: 0;
        }

        .heart::after {
            top: 0;
            left: 7.5px;
        }

        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: rotate(-45deg) translateY(100vh) scale(0.5);
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                opacity: 0;
                transform: rotate(-45deg) translateY(-10vh) scale(1);
            }
        }

        .card {
            position: relative;
            z-index: 10;
            background: white;
            border-radius: 30px;
            padding: 40px;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(255, 107, 138, 0.3);
            text-align: center;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .illustration {
            width: 100%;
            max-height: 280px;
            object-fit: cover;
            border-radius: 20px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .question {
            font-size: 1.5rem;
            color: #e74c7c;
            margin-bottom: 30px;
            line-height: 1.6;
            font-weight: 500;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .btn-yes {
            background: linear-gradient(135deg, #ff6b8a 0%, #ff8fab 100%);
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 1.1rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(255, 107, 138, 0.4);
            font-weight: 600;
        }

        .btn-yes:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(255, 107, 138, 0.5);
        }

        .btn-no {
            background: white;
            color: #ff6b8a;
            border: 2px solid #ff6b8a;
            padding: 12px 40px;
            font-size: 1.1rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            position: relative;
        }

        .btn-no:hover {
            animation: runAway 0.3s ease;
        }

        @keyframes runAway {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-20px, 10px); }
            50% { transform: translate(20px, -10px); }
            75% { transform: translate(-10px, 20px); }
            100% { transform: translate(10px, -10px); }
        }

        @media (max-width: 480px) {
            .card {
                padding: 25px;
            }
            
            .question {
                font-size: 1.2rem;
            }
            
            .buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .btn-yes, .btn-no {
                width: 100%;
                max-width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="hearts-container" id="heartsContainer"></div>
    
    <div class="card">
        <img src="截屏2026-05-14 14.41.44.png" alt="Cute bears" class="illustration">
        
        <div class="question">
            Dear yogurt,<br>
            will you be my Valentine?
        </div>
        
        <div class="buttons">
            <button class="btn-yes" onclick="goToNextPage()">Yes</button>
            <button class="btn-no" id="noBtn">No</button>
        </div>
    </div>

    <script>
        function createHearts() {
            const container = document.getElementById('heartsContainer');
            const heartCount = 15;
            
            for (let i = 0; i < heartCount; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 4 + 's';
                heart.style.animationDuration = (3 + Math.random() * 2) + 's';
                heart.style.transform = `rotate(-45deg) scale(${0.4 + Math.random() * 0.4})`;
                container.appendChild(heart);
            }
        }

        function goToNextPage() {
            window.location.href = 'valentine_next.html';
        }

        const noBtn = document.getElementById('noBtn');
        
        noBtn.addEventListener('mouseenter', () => {
            const rect = noBtn.getBoundingClientRect();
            const cardRect = document.querySelector('.card').getBoundingClientRect();
            
            const maxX = cardRect.width - rect.width;
            const maxY = cardRect.height - rect.height;
            
            const newX = Math.random() * maxX;
            const newY = Math.random() * maxY;
            
            noBtn.style.position = 'absolute';
            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';
        });

        createHearts();
    </script>
</body>
</html>
